name: TunarMac
options:
  bundleIdPrefix: com.liuchong.tunar
  deploymentTarget:
    macOS: "14.0"
targets:
  TunarMac:
    type: application
    platform: macOS
    sources:
      - TunarMac
      - path: ../ios/TunarCore/Sources/TunarCore/tunar_core.swift
      - path: ../ios/Tunar/Bridge/EngineBridge.swift
      - path: ../ios/Tunar/Bridge/TickSounds.swift
      - path: ../ios/Tunar/Bridge/TunarAtomics.c
      - path: ../ios/Tunar/Bridge/TunarAtomics.h
      - path: ../ios/Tunar/Audio/AudioCapture.swift
      - path: ../ios/Tunar/Audio/MetronomePlayer.swift
      - path: ../ios/Tunar/Audio/ReferenceTonePlayer.swift
      - path: ../ios/Tunar/Common/Haptics.swift
      - path: ../ios/Tunar/Settings/SettingsStore.swift
      - path: ../ios/Tunar/Tuner/TunerViewModel.swift
      - path: ../ios/Tunar/Tuner/TuningForkViewModel.swift
      - path: ../ios/Tunar/Tuner/SpectrumHistory.swift
      - path: ../ios/Tunar/Tuner/SpectrumPresentation.swift
      - path: ../ios/Tunar/Instrument/InstrumentViewModel.swift
      - path: ../ios/Tunar/Metronome/MetronomeViewModel.swift
    dependencies:
      - framework: ../ios/TunarCore/tunar_core.xcframework
        embed: false
    info:
      path: TunarMac/Info.plist
      properties:
        CFBundleDisplayName: TUNAR
        NSMicrophoneUsageDescription: "调音需要访问麦克风以检测音高"
        LSApplicationCategoryType: public.app-category.music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuchong.tunar.macos
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DXBQ96GC5Q
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: TunarMac/Bridge/TunarMac-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: TunarMac/TunarMac.entitlements
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/../ios/TunarCore/Sources/TunarCore/tunar_coreFFI.modulemap
  TunarMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TunarMacTests
    dependencies:
      - target: TunarMac
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TunarMac.app/Contents/MacOS/TunarMac
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/../ios/TunarCore/Sources/TunarCore/tunar_coreFFI.modulemap

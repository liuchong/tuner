<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    吐呐 / TUNAR 图标基准图形：声呐 + 调音器。1024 坐标系，
    其余变体一律由本图形绕画布中心 (512,512) 等比缩放得到，几何只在这里定义一次。

    支点 (512,598) 起一根锥形指针指向正上方 12 点，即准音（0 音分）基准线；
    三层同心回声弧 r=190/285/380 各自从 18° 张到 120°，共 240° 底部开口的仪表环，
    中央 ±18° 留窄缝供指针贯穿；由内向外递减粗细与不透明度，读作回声向外扩散。

    配色取自「Aurora/极光」：内环 tune/in #34E0A1，外两层 accent #7C9CFF，
    指针为 tune/in 到 ink/primary 的纵向渐变。图形包围盒对画布中心上下左右对称。
  -->
    <defs>
      <linearGradient id="needle" x1="0" y1="0" x2="0" y2="0.9">
        <stop offset="0" stop-color="#7DF3C8"/>
        <stop offset="0.34" stop-color="#DEF6EC"/>
        <stop offset="1" stop-color="#F2F5F9"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke-linecap="round">
      <g stroke="#7C9CFF" stroke-width="26" opacity="0.42">
        <path d="M 629.4 236.6 A 380 380 0 0 1 841.1 788.0"/>
        <path d="M 394.6 236.6 A 380 380 0 0 0 182.9 788.0"/>
      </g>
      <g stroke="#7C9CFF" stroke-width="36" opacity="0.74">
        <path d="M 600.1 327.0 A 285 285 0 0 1 758.8 740.5"/>
        <path d="M 423.9 327.0 A 285 285 0 0 0 265.2 740.5"/>
      </g>
      <g stroke="#34E0A1" stroke-width="44">
        <path d="M 570.7 417.3 A 190 190 0 0 1 676.5 693.0"/>
        <path d="M 453.3 417.3 A 190 190 0 0 0 347.5 693.0"/>
      </g>
    </g>
    <path d="M 486 598 L 500 270 L 512 214 L 524 270 L 538 598 Z" fill="url(#needle)"/>
    <circle cx="512" cy="598" r="66" fill="none" stroke="#34E0A1" stroke-width="10" opacity="0.5"/>
    <circle cx="512" cy="598" r="36" fill="#F2F5F9"/>
</svg>
